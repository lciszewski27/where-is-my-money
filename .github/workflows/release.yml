name: Build & Publish Release

on:
  push:
    tags:
      - "v*" # Uruchamia się automatycznie po dodaniu taga np. v1.0.0, v2.1.4

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wymagane uprawnienie do tworzenia wpisów w GitHub Releases

    steps:
      # 1. Pobranie kodu z repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Konfiguracja JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # 3. Nadanie praw wykonywania dla skryptu wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Wyliczenie numeracji versionCode oraz versionName z taga Git
      - name: Extract Version Info
        id: version
        run: |
          # Wyciągnięcie nazwy taga (np. refs/tags/v1.2.3 -> v1.2.3)
          TAG_NAME=${GITHUB_REF#refs/tags/}

          # Usunięcie przedrostka 'v' dla versionName (np. v1.2.3 -> 1.2.3)
          VERSION_NAME=${TAG_NAME#v}

          # Numer uruchomienia workflow jako unikalny, rosnący versionCode
          VERSION_CODE=${{ github.run_number }}

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      # 5. Budowanie wersji Release z przekazaniem nowej wersji
      - name: Build Unsigned Release APK
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PVERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            --no-daemon

      # 6. Podpisanie wygenerowanego pliku APK przy użyciu klucza JKS z GitHub Secrets
      - name: Sign Release APK
        uses: rslnk/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 7. Zmiana nazwy pliku APK na format z numerem taga (np. app-v1.2.3.apk)
      - name: Rename Signed APK
        run: |
          mv ${{ steps.sign_app.outputs.signedFile }} app/build/outputs/apk/release/app-${{ steps.version.outputs.TAG_NAME }}.apk

      # 8. Utworzenie wpisu w GitHub Releases i załączenie podpisanego pliku APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.TAG_NAME }}
          files: app/build/outputs/apk/release/app-${{ steps.version.outputs.TAG_NAME }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
